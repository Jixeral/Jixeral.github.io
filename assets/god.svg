<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- the surreal "god" character from punpun - just a face with afro -->
  <!-- afro -->
  <circle cx="100" cy="110" r="78" fill="#0a0a0a"/>
  <circle cx="55" cy="80" r="20" fill="#0a0a0a"/>
  <circle cx="145" cy="80" r="20" fill="#0a0a0a"/>
  <circle cx="40" cy="120" r="22" fill="#0a0a0a"/>
  <circle cx="160" cy="120" r="22" fill="#0a0a0a"/>
  <circle cx="60" cy="160" r="18" fill="#0a0a0a"/>
  <circle cx="140" cy="160" r="18" fill="#0a0a0a"/>
  <!-- face: just a smile in a black circle -->
  <ellipse cx="100" cy="110" rx="55" ry="60" fill="#0a0a0a"/>
  <!-- big white grin -->
  <path d="M 65 125 Q 100 165 135 125 L 135 130 Q 100 170 65 130 Z" fill="#f2f0ec" stroke="#f2f0ec" stroke-width="2"/>
  <!-- teeth lines -->
  <line x1="78" y1="135" x2="78" y2="148" stroke="#0a0a0a" stroke-width="1"/>
  <line x1="91" y1="140" x2="91" y2="155" stroke="#0a0a0a" stroke-width="1"/>
  <line x1="100" y1="142" x2="100" y2="158" stroke="#0a0a0a" stroke-width="1"/>
  <line x1="109" y1="140" x2="109" y2="155" stroke="#0a0a0a" stroke-width="1"/>
  <line x1="122" y1="135" x2="122" y2="148" stroke="#0a0a0a" stroke-width="1"/>
  <!-- floating quote bubble -->
  <text x="100" y="220" font-family="serif" font-size="11" fill="#9a9a96" text-anchor="middle" font-style="italic">"hello, hello!"</text>
</svg>
