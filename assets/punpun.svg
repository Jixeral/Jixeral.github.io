<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- punpun: simple bird, white body, triangular wings & beak, red & black eyes -->
  <!-- body -->
  <ellipse cx="100" cy="130" rx="68" ry="78" fill="#f2f0ec" stroke="#0a0a0a" stroke-width="2.5"/>
  <!-- hair tufts on top -->
  <path d="M 50 65 L 60 95 L 72 70 Z" fill="#f2f0ec" stroke="#0a0a0a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 78 55 L 88 90 L 100 62 Z" fill="#f2f0ec" stroke="#0a0a0a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 105 60 L 116 90 L 128 57 Z" fill="#f2f0ec" stroke="#0a0a0a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 132 65 L 142 95 L 152 70 Z" fill="#f2f0ec" stroke="#0a0a0a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- beak -->
  <path d="M 92 130 L 100 138 L 108 130 L 100 124 Z" fill="#d4a060" stroke="#0a0a0a" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="78" cy="115" r="7" fill="#0a0a0a"/>
  <circle cx="76" cy="113" r="2" fill="#f2f0ec"/>
  <circle cx="122" cy="115" r="7" fill="#c43030"/>
  <circle cx="120" cy="113" r="2" fill="#f2f0ec"/>
  <!-- subtle blush / shadow under -->
  <ellipse cx="100" cy="190" rx="40" ry="6" fill="#0a0a0a" opacity="0.08"/>
  <!-- tiny feet -->
  <line x1="88" y1="206" x2="84" y2="220" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"/>
  <line x1="112" y1="206" x2="116" y2="220" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"/>
  <line x1="84" y1="220" x2="78" y2="220" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"/>
  <line x1="84" y1="220" x2="88" y2="220" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"/>
  <line x1="116" y1="220" x2="112" y2="220" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"/>
  <line x1="116" y1="220" x2="120" y2="220" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round"/>
</svg>
